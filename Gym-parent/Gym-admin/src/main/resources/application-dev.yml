# 配置服务端口号
server:
  port: 9601

# 配置数据库连接信息 url需要改成自己的虚拟机ip地址192.168.10.100
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.10.100:3306/gym?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 1234

#  jackson:
#    # 全局设置时区为东八区
#    time-zone: GMT+8
#    # 日期格式，和数据库保持一致
#    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: 2MB # 单个文件最大上传大小：改为2MB
      max-request-size: 2MB # 单次请求最大大小（多文件上传总大小），建议和单文件一致

    # Redis的相关配置
  data:
    redis:
      host: 192.168.10.100
      port: 6379
  #  password: 1234

# mybatis的配置
mybatis:
  config-location: classpath:/mybatis-config.xml
  mapper-locations: classpath:/mapper/*/*.xml

# 自定义配置 访问权限路由配置
gym:
  auth:
    noAuthUrls:
      - /admin/system/index/login
      - /admin/system/index/generateValidateCode
      - /admin/system/user/register
      - /admin/system/fileUpload
      - /front/sign-in/** #生成二维码访问后扫码跳转后访问路径
      - /front/login
      - /front/register
      - /front/generateValidateCode
      - /admin/system/index/sendCode/**
      - /admin/system/index/sendEmail
      - /front/agent/chat
      # 新增 Swagger 相关路径
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /v2/api-docs/**          # 如果使用 Swagger2
      - /swagger-resources/**
      - /webjars/**
      - /doc.html                # 如果使用 Knife4j
      - /error                   # 可选，避免错误页面被拦截
  minio:
    endpointUrl: http://192.168.10.100:9001
    accessKey: admin
    secreKey: admin123456
    bucketName: gym-bucket

  agent:
    draft:
      # Agent 草稿过期时间，单位：分钟
      ttl-minutes: 15

    # 自建 Harness 运行预算。
    # 这些是本轮建议默认值，不是通用标准或压测结论，可按实际调整。
    harness:
      # 单轮最多发起多少次 Agent 模型请求（含失败重试计数，不含 RAG 工具内部模型调用）
      max-agent-model-calls: 6
      # 单轮最多派发多少次工具调用（按派发尝试计数，包含被拒绝的调用）
      max-tool-calls: 8
      # 单轮最长耗时，单位毫秒
      max-run-duration-ms: 60000
      # 上下文 Token 估算上限（按字符构成估算，不是服务端精确计数）
      max-context-tokens: 12000
      # 单条工具结果写入模型上下文前的最大字符数
      max-tool-result-chars: 6000
      # 相同工具 + 相同参数的最大执行次数
      repeat-tool-threshold: 3
      # 会话并发锁有效期，单位毫秒
      session-lock-ttl-ms: 60000